name: Quarto Publish (reusable)

on:
  workflow_call:
    inputs:
      needs_python:
        type: boolean
        default: false
      python_version:
        type: string
        default: "3.11"
      python_packages:
        type: string
        default: ""
        description: "Pacotes pip inline, ex: 'numpy scipy matplotlib'. Ignorado se houver requirements.txt no repo."
      needs_r:
        type: boolean
        default: false
      r_version:
        type: string
        default: "4.4.0"
      r_packages:
        type: string
        default: ""
        description: "Lista R, ex: 'knitr, rmarkdown, magick, pdftools'"
      needs_magick_system_deps:
        type: boolean
        default: false
      needs_pdf2svg:
        type: boolean
        default: false
      needs_tinytex:
        type: boolean
        default: false
      tinytex_packages:
        type: string
        default: "pgf pgfplots xcolor"
      output_dir:
        type: string
        default: "_site"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Baixar tema compartilhado (TemaRTx.scss)
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/raphateixeira/.github/main/assets/TemaRTx.scss \
            -o TemaRTx.scss

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        if: ${{ inputs.needs_python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Python dependencies
        if: ${{ inputs.needs_python }}
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -n "${{ inputs.python_packages }}" ]; then
            pip install ${{ inputs.python_packages }}
          fi

      - name: Install R
        if: ${{ inputs.needs_r }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r_version }}

      - name: Install system dependencies for magick
        if: ${{ inputs.needs_magick_system_deps }}
        run: sudo apt-get update && sudo apt-get install -y libmagick++-dev ghostscript

      - name: Install pdf2svg
        if: ${{ inputs.needs_pdf2svg }}
        run: sudo apt-get update && sudo apt-get install -y pdf2svg

      - name: Preparar lista de pacotes R
        if: ${{ inputs.needs_r && inputs.r_packages != '' }}
        id: rpkgs
        run: |
          {
            echo "list<<EOF"
            echo "${{ inputs.r_packages }}" | tr ',' '\n' | sed 's/^ *//;s/ *$//;s/^/any::/'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install R dependencies
        if: ${{ inputs.needs_r && inputs.r_packages != '' }}
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: ${{ steps.rpkgs.outputs.list }}

      - name: Install TinyTeX + pacotes TikZ
        if: ${{ inputs.needs_tinytex }}
        run: |
          quarto install tinytex --no-prompt
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          tlmgr update --self
          tlmgr install ${{ inputs.tinytex_packages }}

      - name: Render
        run: quarto render
        env:
          RETICULATE_PYTHON: ${{ inputs.needs_python && env.pythonLocation || '' }}/bin/python

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.output_dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
